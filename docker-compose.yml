version: "3.8"
networks:
    application:
        driver: bridge

services:
    db:
        image: mysql:8.0
        ports:
            - "3306:3306"
        volumes:
            - ./data:/var/lib/mysql
        environment:
            - MYSQL_ROOT_PASSWORD=root
            - MYSQL_DATABASE=dockerlaravel
        networks:
            - application
        container_name: mysqldb
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot || exit 1"]
            interval: 5s
            timeout: 5s
            retries: 30
        restart: unless-stopped

    app:
        build: .
        container_name: backend
        ports:
            - 8000:8000
        depends_on:
            db:
                condition: service_healthy
        environment:
            - APP_NAME=laravel
            - APP_ENV=local
            - APP_KEY=base64:TvMKeLj2LND4hZqXdbQFiTg8BkXCAwty4wDLlAmNZsQ=
            - APP_DEBUG=true
            - APP_URL=http://localhost

            - DB_CONNECTION=mysql
            - DB_HOST=db
            - DB_PORT=3306
            - DB_DATABASE=dockerlaravel
            - DB_USERNAME=root
            - DB_PASSWORD=root
        networks:
            - application
        volumes:
            - .:/app
        command: >
            sh -c "
            composer install &&
            npm install &&
            npm run build &&
            php artisan migrate &&
            php artisan serve --host=0.0.0.0 --port=8000
            "
        restart: unless-stopped
