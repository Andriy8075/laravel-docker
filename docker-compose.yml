version: "3.8"
networks:
    application:
        driver: bridge

services:
    db:
        image: mariadb:latest
        ports:
            - "3306:3306"
        volumes:
            - ./data:/var/lib/mysql
        environment:
            - MARIADB_ROOT_PASSWORD=root
            - MARIADB_DATABASE=dockerlaravel
            - MARIADB_USER=laravel
            - MARIADB_PASSWORD=secret
            - MARIADB_AUTO_UPGRADE=1  # Optional for auto-upgrade safety
        networks:
            - application
        container_name: mysqldb
        healthcheck:
            test: ["CMD", "mariadb-admin", "ping", "--user=root", "--password=root"]
            interval: 5s
            timeout: 5s
            retries: 30
        restart: unless-stopped

    app:
        build: .
        container_name: backend
        ports:
            - "8000:8000"
        command: sh -c "
            composer install &&
            npm install &&
            npm run build &&
            php artisan migrate &&
            php artisan serve --host=0.0.0.0 --port=8000
            "
        depends_on:
            db:
                condition: service_healthy
        environment:
            - APP_NAME=laravel
            - APP_ENV=local
            - APP_KEY=base64:TvMKeLj2LND4hZqXdbQFiTg8BkXCAwty4wDLlAmNZsQ=
            - APP_DEBUG=true
            - APP_URL=http://localhost

            - DB_CONNECTION=mysql
            - DB_HOST=db
            - DB_PORT=3306
            - DB_DATABASE=dockerlaravel
            - DB_USERNAME=laravel
            - DB_PASSWORD=secret
        networks:
            - application
        volumes:
            - .:/var/www
        restart: unless-stopped
